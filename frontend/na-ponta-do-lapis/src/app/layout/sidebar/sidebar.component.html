<aside class="sidebar flex flex-col h-full bg-white" [class.aberta]="sidebarService.aberto()">
        <div class="flex menu-header">
            <img src="logo.svg" alt="logomarca" class="logo">
            <button
                type="button"
                aria-label="Alternar menu lateral"
                (click)="sidebarService.toggleSidebar()"
                class="menu-btn w-10 h-10 flex items-center justify-center rounded-xl hover:bg-slate-100/80 transition-colors"
                [class.text-white]="themeService.escuro()"
                [class.text-black]="!themeService.escuro()">
                <app-icon [name]="sidebarService.aberto() ? 'close' : 'menu'" class="w-5 h-5"/>
            </button>
        </div>
    <a [routerLink]="['/app/transacoes']" [queryParams]="{ openDialog: 'escolha' }"
       data-tour="nova-transacao"
       (click)="isMobile ? sidebarService.fecharSidebar() : null"
       routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }"
       class="menuitem botao-nova-transacao flex items-center justify-center gap-2 text-white! btn-npl-primary whitespace-nowrap shrink-0">
        <app-icon name="plus" class="w-5 h-5 shrink-0" />
        <span class="menulabel text-sm font-semibold">
            Nova Transação
        </span>
    </a>
    @for (item of items; track item.label){
        <a [routerLink]="item.routerLink" [attr.data-tour]="'menu-' + item.icon" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }" (click)="isMobile ? sidebarService.fecharSidebar() : null" class="menuitem flex  text-gray-900 gap-2.5 ">
            <app-icon [name]="item.icon" class="w-5.5" /> 
            <span class="menulabel">
                {{ item.label }}
            </span>
        </a>

    }
    @if (mostrarPainelAdmin) {
        <div class="mt-auto pt-3 border-t border-slate-200/70">
            <a [routerLink]="['/admin/dashboard']"
               (click)="isMobile ? sidebarService.fecharSidebar() : null"
               class="menuitem flex items-center text-[#7843CD] gap-2.5">
                <app-icon name="admin" class="w-5.5" />
                <span class="menulabel font-semibold">Painel Admin</span>
            </a>
        </div>
    }
</aside>
