<nav class="sticky z-50 w-full border-b border-gray-300">
  <div class=" mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
        
        <div class="flex items-center gap-5 ">
            @if(isMobile) {
                <div class="flex gap-2.5">
                    <button (click)="sidebarService.toggleSidebar()" class="menu-btn w-5">
                        <app-icon name="menu" class="text-black"/>
                    </button>
                </div>
            }
        </div>
        <div class="flex items-center gap-5 ">
          <div class="relative cursor-pointer text-slate-600 hover:text-[#7843CD] transition-colors p-1" title="Notificações">
            <i class="pi pi-bell text-lg"></i>
            <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-[#EEC046] rounded-full ring-2 ring-white"></span>
          </div>
          <div><img class="h-11 w-11 rounded-full border-2 border-[#EEC046] shadow-2xs object-cover" [src]="usuarioLogado?.fotoPerfil" (error)="usarFotoPadrao($event)" alt="{{usuarioLogado?.nome}}"></div>
          <div><p class="nomeUser font-medium text-slate-800">{{ nomeUsuario }}</p></div>
          <div>
              <p-button variant="text" class="sair font-bold" styleClass="text-red-500! hover:bg-[#fef2f2]! text-xs rounded-xl" (onClick)="logout()">Sair<i class="pi pi-sign-out "></i></p-button>
          </div>
        </div>
    
    </div>
  </div>
</nav>
