<div class="relative flex h-screen w-full bg-white overflow-hidden">

  <!-- Coluna esquerda: Login -->
  <div
    class="auth-slot w-full md:w-1/2 h-full"
    [class.hidden]="isSignup()"
    [class.md:block]="true"
    [class.auth-slot-inactive]="isSignup()"
    [attr.aria-hidden]="isSignup()"
    [attr.inert]="isSignup() ? '' : null">
    <app-login [embedded]="true"></app-login>
  </div>

  <!-- Coluna direita: Cadastro -->
  <div
    class="auth-slot w-full md:w-1/2 h-full"
    [class.hidden]="!isSignup()"
    [class.md:block]="true"
    [class.auth-slot-inactive]="!isSignup()"
    [attr.aria-hidden]="!isSignup()"
    [attr.inert]="!isSignup() ? '' : null">
    <app-signup [embedded]="true"></app-signup>
  </div>

  <!-- Painel deslizante da marca (desktop): direita no Login, desliza para a esquerda no Cadastro -->
  <div
    class="auth-brand-panel hidden md:flex w-1/2 h-full absolute top-0 right-0 z-20 bg-[#D1C4FF] items-center justify-center overflow-hidden shadow-xl"
    [class.auth-brand-left]="isSignup()">
    <div class="flex flex-col items-center gap-4 z-10 px-8 text-center max-w-sm">
      <img src="/logo.svg" alt="Na Ponta do Lápis" class="w-64 max-w-xs drop-shadow-xs">
      <div class="w-12 h-1 rounded-full bg-[#EEC046]"></div>
      <p class="text-sm font-medium text-[#4A2585]/85 tracking-wide leading-relaxed">
        @if (isSignup()) {
          Comece hoje a organizar suas metas, contas e finanças pessoais ou familiares.
        } @else {
          Seu controle financeiro pessoal e familiar, simples e na ponta do lápis.
        }
      </p>
    </div>
  </div>

</div>
