<div class="w-full flex flex-col gap-6 pb-8 text-left">

  <!-- Cabeçalho Principal da Página (Padrão Design System) -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
    <div>
      <h1 class="page-title-npl m-0">Meu Perfil</h1>
      <p class="page-subtitle-npl">Gerencie seus dados pessoais, preferências, Open Finance e assistentes de IA</p>
    </div>
  </div>

  <div class="w-full flex flex-col lg:flex-row items-start gap-8">
    <!-- Coluna Lateral (Perfil e Resumo) -->
    <aside class="w-full lg:w-80 lg:shrink-0 flex flex-col">
      <app-area-perfil-component class="w-full block"></app-area-perfil-component>
    </aside>

    <!-- Coluna Principal (Ajustes e Conexões) -->
    <main class="w-full flex-1 flex flex-col min-w-0">
      <app-ajustes-do-perfil class="w-full block"></app-ajustes-do-perfil>
    </main>
  </div>

  <!-- Ação de Sair dedicada para mobile/app (padrão mobile: no fim do Perfil) -->
  <div class="md:hidden pt-2">
    <button
      type="button"
      (click)="sairDaConta()"
      class="w-full flex items-center justify-center gap-2.5 py-3.5 px-4 rounded-2xl border border-rose-200 bg-rose-50/70 hover:bg-rose-100/80 text-rose-600 font-bold text-sm transition-colors cursor-pointer">
      <i class="pi pi-sign-out text-sm"></i>
      <span>Sair da conta</span>
    </button>
  </div>

</div>
