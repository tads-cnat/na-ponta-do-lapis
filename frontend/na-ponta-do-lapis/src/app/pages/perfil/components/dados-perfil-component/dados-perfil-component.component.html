<div class="w-full flex flex-col font-sans text-left">
  
  <div class="flex items-center gap-2 mb-4">
    <div class="w-6 h-6 rounded-lg bg-[#6214CC]/10 text-[#6214CC] flex items-center justify-center text-xs">
      <i class="pi pi-id-card"></i>
    </div>
    <h3 class="text-slate-900 font-bold text-sm tracking-tight">
      Resumo da Conta
    </h3>
  </div>

  @if (usuarioLogado) {
    <div class="flex flex-col gap-3 w-full">
      
      <div class="flex items-center justify-between text-xs py-1.5 border-b border-slate-50">
        <span class="text-slate-500 font-medium flex items-center gap-2">
          <i class="pi pi-user text-slate-400 text-xs"></i>
          Papel
        </span>
        <span class="text-slate-800 font-semibold">
          {{ obterPapel() }}
        </span>
      </div>

      <div class="flex items-center justify-between text-xs py-1.5 border-b border-slate-50">
        <span class="text-slate-500 font-medium flex items-center gap-2">
          <i class="pi pi-money-bill text-slate-400 text-xs"></i>
          Moeda Base
        </span>
        <span class="text-slate-800 font-semibold">
          {{ obterMoeda() }}
        </span>
      </div>

      <div class="flex items-center justify-between text-xs py-1.5">
        <span class="text-slate-500 font-medium flex items-center gap-2">
          <i class="pi pi-users text-slate-400 text-xs"></i>
          Família
        </span>
        <span class="text-slate-800 font-semibold">
          {{ obterFamilia() }}
        </span>
      </div>

    </div>
  } @else {
    <div class="flex flex-col gap-2.5 animate-pulse w-full">
      <div class="h-3.5 bg-slate-100 rounded w-3/4"></div>
      <div class="h-3.5 bg-slate-100 rounded w-5/6"></div>
      <div class="h-3.5 bg-slate-100 rounded w-2/3"></div>
    </div>
  }

</div>
