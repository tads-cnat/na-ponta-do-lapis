<div class="w-full min-h-full bg-[#ffffff] rounded-[20px] p-8 md:p-10 flex flex-col font-sans shadow-sm"
     [ngClass]="abaAtiva === 'dados' ? 'justify-between' : 'justify-start gap-8'">

  <div class="w-full flex flex-col">
    <!-- Tabs Header -->
    <div class="flex items-center gap-6 border-b border-slate-200 mb-8">
      <button type="button"
              (click)="abaAtiva = 'dados'"
              [ngClass]="abaAtiva === 'dados' ? 'text-slate-900 border-indigo-600 font-extrabold' : 'text-slate-400 border-transparent font-medium hover:text-slate-600'"
              class="pb-3 text-xl md:text-2xl tracking-tight border-b-2 transition-all cursor-pointer">
        Ajustes do perfil
      </button>

      <button type="button"
              (click)="abaAtiva = 'integracoes'"
              [ngClass]="abaAtiva === 'integracoes' ? 'text-slate-900 border-indigo-600 font-extrabold' : 'text-slate-400 border-transparent font-medium hover:text-slate-600'"
              class="pb-3 text-xl md:text-2xl tracking-tight border-b-2 transition-all cursor-pointer flex items-center gap-2">
        <span>Conexões & IA</span>
        <span class="text-[10px] bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full font-bold uppercase tracking-wide">Novo</span>
      </button>
    </div>

    <!-- Conteúdo Aba 1: Dados do Perfil -->
    <div *ngIf="abaAtiva === 'dados'" [formGroup]="perfilForm" class="flex flex-col justify-between w-full">
      <div class="flex-1 flex flex-col justify-between w-full mb-8">
        <app-formulario-secao 
          titulo="Detalhes" 
          [campos]="camposDetalhes"
          [formGroupPai]="perfilForm"
          class="w-full block [&_h2]:text-xl [&_h2]:font-bold [&_h2]:mb-2">
        </app-formulario-secao>

        <!-- Seção: Moeda Principal da Conta -->
        <div class="w-full flex flex-col gap-3 my-6 pt-6 border-t border-slate-100">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold text-slate-900 tracking-tight">Moeda Padrão</h2>
            <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-100/80">
              {{ obterSimboloMoeda(perfilForm.get('moedaPadrao')?.value) }} {{ perfilForm.get('moedaPadrao')?.value }}
            </span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            @for (op of opcoesMoeda; track op.codigo) {
              <button
                type="button"
                (click)="selecionarMoedaPadrao(op.codigo)"
                [class]="perfilForm.get('moedaPadrao')?.value === op.codigo
                  ? 'flex items-center gap-3 p-3.5 rounded-2xl border-2 border-indigo-600 bg-indigo-50/70 text-indigo-950 font-semibold transition-colors shadow-xs cursor-pointer text-left'
                  : 'flex items-center gap-3 p-3.5 rounded-2xl border-2 border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-medium transition-colors cursor-pointer text-left'">
                <span class="text-2xl select-none">{{ op.bandeira }}</span>
                <div class="flex flex-col min-w-0">
                  <span class="text-sm font-bold leading-tight truncate">{{ op.nome }}</span>
                  <span class="text-xs text-slate-500 font-normal">{{ op.simbolo }} ({{ op.codigo }})</span>
                </div>
              </button>
            }
          </div>
        </div>

        <app-formulario-secao 
          titulo="Senha" 
          [campos]="camposSenha"
          [formGroupPai]="perfilForm"
          class="w-full block [&_h2]:text-xl [&_h2]:font-bold [&_h2]:mb-2">
        </app-formulario-secao>
      </div>

      <app-botoes-acao 
        [podeAbrirConfirmacao]="podeAbrirConfirmacao"
        (cliqueSalvar)="salvarMudancas()">
      </app-botoes-acao>
    </div>

    <!-- Conteúdo Aba 2: Integrações e Chaves de API -->
    <div *ngIf="abaAtiva === 'integracoes'" class="w-full">
      <app-integracoes-perfil></app-integracoes-perfil>
    </div>
  </div>

</div>
