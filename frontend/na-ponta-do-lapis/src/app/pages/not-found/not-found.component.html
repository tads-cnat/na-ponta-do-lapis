<div
  style="padding-top: var(--npl-safe-top); padding-bottom: var(--npl-safe-bottom);"
  class="min-h-screen bg-[#f8fafc] dark:bg-[#141318] flex items-center justify-center p-6 relative overflow-hidden">

  <!-- Detalhes sutis da paleta da marca -->
  <div class="absolute -top-32 -left-32 w-80 h-80 bg-[#7843CD]/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-80 h-80 bg-[#EEC046]/15 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-md w-full text-center relative z-10 bg-white dark:bg-[#1f1d26] border border-slate-100 dark:border-[#383444] rounded-[2rem] p-8 sm:p-10 shadow-xl flex flex-col items-center">
    <img src="logo.svg" alt="Na Ponta do Lápis" class="h-11 mb-6 select-none" />

    <h1 class="text-6xl sm:text-7xl font-black tracking-tight text-[#7843CD] dark:text-[#c4b5fd] m-0 leading-none">
      404
    </h1>

    <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-zinc-100 mt-3 mb-2">
      Página não encontrada
    </h2>

    <p class="text-slate-500 dark:text-zinc-400 text-sm leading-relaxed mb-7 m-0">
      A página que você tentou acessar não existe, foi movida ou o endereço foi digitado incorretamente.
    </p>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-3 w-full">
      <a routerLink="/"
         class="w-full sm:flex-1 inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl btn-npl-primary font-semibold text-sm no-underline">
        <i class="pi pi-home text-xs"></i>
        <span>Início</span>
      </a>

      <a routerLink="/app/dashboard"
         class="w-full sm:flex-1 inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl btn-npl-secondary font-semibold text-sm no-underline">
        <app-icon name="dashboard" class="w-4 h-4 shrink-0" />
        <span>Dashboard</span>
      </a>
    </div>
  </div>
</div>
