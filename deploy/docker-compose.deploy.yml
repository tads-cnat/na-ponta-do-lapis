services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data      # volume nomeado = persistência
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: npl2026/backend:${APP_VERSION}
    pull_policy: always                      # garante pull da tag móvel :homolog
    restart: unless-stopped
    expose: ["8080"]                         # sem ports → só Traefik (api.) e Nginx (/api) alcançam
    environment:
      # Defaults seguros: se a variável não existir no Coolify, não cai no profile local
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Homolog e Produção (pré-lançamento): update por padrão para aplicar novos campos de conta/cartão/IA
      SPRING_JPA_HIBERNATE_DDLAUTO: ${SPRING_JPA_HIBERNATE_DDLAUTO:-update}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-${SPRING_JPA_HIBERNATE_DDLAUTO:-update}}
      # Homolog: true | Produção: false (evita criar usuários de teste em banco vazio)
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      # URL pública do frontend (usada em redirects e na página de erro da API)
      APP_WEB_URL: ${APP_WEB_URL:-https://napontadolapis.app}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SWAGGER_ENABLED:-false}
      SPRINGDOC_API_DOCS_ENABLED: ${SWAGGER_ENABLED:-false}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      # Análise de faturas com IA (opcionais com defaults seguros)
      FATURA_COOKIE_SECRET: ${FATURA_COOKIE_SECRET:-}
      FATURA_OCR_ENABLED: ${FATURA_OCR_ENABLED:-true}
      FATURA_IA_GEMINI_MODEL: ${FATURA_IA_GEMINI_MODEL:-gemini-2.5-flash}
      FATURA_IA_CLAUDE_MODEL: ${FATURA_IA_CLAUDE_MODEL:-claude-sonnet-4-5}
      FATURA_IA_OPENAI_MODEL: ${FATURA_IA_OPENAI_MODEL:-gpt-4.1-mini}
      FATURA_IA_DEEPSEEK_MODEL: ${FATURA_IA_DEEPSEEK_MODEL:-deepseek-chat}
      FATURA_IA_GROQ_MODEL: ${FATURA_IA_GROQ_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    image: npl2026/frontend:${APP_VERSION}
    pull_policy: always
    restart: unless-stopped
    expose: ["80"]                           # domínio atribuído pelo Coolify (Traefik)
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
