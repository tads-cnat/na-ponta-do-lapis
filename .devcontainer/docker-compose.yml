volumes:
  postgres-data:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Devem ser iguais aos valores do container do banco (db)
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: npl_db
      POSTGRES_HOSTNAME: db

    volumes:
      # Monta apenas a pasta do projeto (a pasta acima de .devcontainer)
      - ..:/workspace:cached

    # Mantém o container vivo após o processo principal
    command: sleep infinity

    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:16
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d npl_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      # Devem ser iguais aos valores do container app
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: npl_db

networks:
  app-network:
    driver: bridge
