version: 2

updates:
  # Backend (Spring Boot / Maven)
  - package-ecosystem: "maven"
    directory: "/backend/na-ponta-do-lapis"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      spring-boot:
        patterns:
          - "org.springframework*"
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/backend/na-ponta-do-lapis"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  # Frontend (Angular / npm)
  - package-ecosystem: "npm"
    directory: "/frontend/na-ponta-do-lapis"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      angular:
        patterns:
          - "@angular*"
          - "zone.js"
          - "typescript"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/frontend/na-ponta-do-lapis"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  # Scripts da raiz
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"

  # Devcontainer
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions (workflows de CI/CD)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
