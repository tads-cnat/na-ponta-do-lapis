name: CI — Build Check

on:
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Build Backend (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build com Maven (sem testes)
        working-directory: backend/na-ponta-do-lapis
        run: ./mvnw package -DskipTests --no-transfer-progress

  dockerhub:
    name: Build e Push Docker Hub Backend
    runs-on: ubuntu-latest
    needs: backend 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: ./backend/na-ponta-do-lapis
          dockerfile: ./backend/na-ponta-do-lapis/Dockerfile
          push: true
          tags: |
            npl2026/backend:latest
            npl2026/backend:${{ github.sha }}

 
