name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/ci-back.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/ci-back.yml'

jobs:
  backend:
    name: Build & Verify Backend (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Garantir permissão de execução do mvnw
        run: chmod +x backend/na-ponta-do-lapis/mvnw

      - name: Testes e build com Maven
        working-directory: backend/na-ponta-do-lapis
        run: ./mvnw verify --no-transfer-progress

      - name: Publicar JAR validado
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/na-ponta-do-lapis/target/na-ponta-do-lapis-*.jar
          if-no-files-found: error
          retention-days: 1

  dockerhub:
    name: Validar imagem Docker e publicar na main
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar JAR validado
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/na-ponta-do-lapis/target

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no DockerHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: ./backend/na-ponta-do-lapis
          file: ./backend/na-ponta-do-lapis/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            npl2026/backend:latest
            npl2026/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
