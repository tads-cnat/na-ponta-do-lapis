name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/ci-back.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes e verificação (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Garantir permissão de execução do mvnw
        run: chmod +x backend/na-ponta-do-lapis/mvnw

      - name: Testes e build com Maven
        working-directory: backend/na-ponta-do-lapis
        run: ./mvnw verify --no-transfer-progress

  docker:
    name: Validação do build Docker (sem push)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem (apenas validação)
        uses: docker/build-push-action@v6
        with:
          context: ./backend/na-ponta-do-lapis
          file: ./backend/na-ponta-do-lapis/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
