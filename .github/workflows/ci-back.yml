name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/ci-back.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/ci-back.yml'

jobs:
  backend:
    name: Build & Verify Backend (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Garantir permissão de execução do mvnw
        run: chmod +x backend/na-ponta-do-lapis/mvnw

      - name: Build com Maven
        working-directory: backend/na-ponta-do-lapis
        run: ./mvnw package -DskipTests --no-transfer-progress

  dockerhub:
    name: Build e Push Docker Hub Backend
    runs-on: ubuntu-latest
    needs: backend
    # Publica a imagem no Docker Hub apenas quando o commit for integrado/mergeado na main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: ./backend/na-ponta-do-lapis
          file: ./backend/na-ponta-do-lapis/Dockerfile
          push: true
          tags: |
            npl2026/backend:latest
            npl2026/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
