name: Release (Produção)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo de versão"
        type: choice
        options: [patch, minor, major]
        default: patch
      gerar_apk:
        description: "Gerar e anexar APK Android nesta release?"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  validar-branch:
    name: Validar Branch (main)
    runs-on: ubuntu-latest
    steps:
      - name: Garantir execução apenas na main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::A release de produção só pode ser executada a partir da branch main (branch atual: ${GITHUB_REF_NAME})."
          exit 1

  approve:
    name: Solicitar Aprovação da Release
    needs: validar-branch
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar Aprovação Manual
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ vars.RELEASE_APPROVERS }}
          minimum-approvals: ${{ vars.RELEASE_MIN_APPROVALS || 3 }}
          issue-timeout-seconds: ${{ vars.RELEASE_TIMEOUT_SECONDS || 86400 }}
          issue-title: "Aprovação necessária para a Release (Tipo: ${{ inputs.bump }})"
          issue-body: |
            Uma nova execução de Release para Produção foi iniciada.
            
            **Disparado por:** `@${{ github.actor }}`
            **Tipo de bump:** `${{ inputs.bump }}`
            **Commit SHA:** `${{ github.sha }}`
            
            Por favor, aprovem digitando `approved` nesta issue ou utilizando o botão de resposta.

  release:
    name: Gerar Release e Imagens
    needs: approve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Calcular próxima versão
        id: semver
        run: |
          LAST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          LAST=${LAST:-v0.0.0}
          IFS='.' read -r MAJ MIN PAT <<< "${LAST#v}"
          case "${{ inputs.bump }}" in
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            patch) PAT=$((PAT+1)) ;;
          esac
          echo "version=$MAJ.$MIN.$PAT" >> "$GITHUB_OUTPUT"
          echo "### $LAST → v$MAJ.$MIN.$PAT" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promover imagens (sha → versão)
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          for svc in backend frontend; do
            docker buildx imagetools create \
              -t npl2026/$svc:$VERSION \
              npl2026/$svc:$SHA_TAG
          done

      - uses: actions/setup-node@v4
        if: ${{ inputs.gerar_apk }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/na-ponta-do-lapis/package-lock.json

      - uses: actions/setup-java@v4
        if: ${{ inputs.gerar_apk }}
        with:
          distribution: temurin
          java-version: 21

      - name: Compilar APK Android (Capacitor)
        if: ${{ inputs.gerar_apk }}
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd frontend/na-ponta-do-lapis
          npm ci
          npm run cap:sync
          cd android
          chmod +x gradlew
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Secrets de assinatura Android (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) são obrigatórios na release de produção."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          ./gradlew assembleRelease --no-daemon \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="$VERSION" \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk "${{ github.workspace }}/na-ponta-do-lapis-v${VERSION}.apk"
          rm -f app/release.keystore

      - name: Criar tag Git e GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.semver.outputs.version }}
          GERAR_APK: ${{ inputs.gerar_apk }}
        run: |
          if [ "$GERAR_APK" = "true" ]; then
            APK_FILE=$(ls na-ponta-do-lapis-v${VERSION}*.apk | head -n1)
            gh release create "v$VERSION" "$APK_FILE" --target "$GITHUB_SHA" \
              --title "v$VERSION" --generate-notes \
              --notes "Imagens: npl2026/backend:$VERSION, npl2026/frontend:$VERSION | APK Android anexado"
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" \
              --title "v$VERSION" --generate-notes \
              --notes "Imagens: npl2026/backend:$VERSION, npl2026/frontend:$VERSION (sem novo APK)"
          fi
