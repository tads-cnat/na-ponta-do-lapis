name: Release (Produção)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo de versão"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Calcular próxima versão
        id: semver
        run: |
          LAST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          LAST=${LAST:-v0.0.0}
          IFS='.' read -r MAJ MIN PAT <<< "${LAST#v}"
          case "${{ inputs.bump }}" in
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            patch) PAT=$((PAT+1)) ;;
          esac
          echo "version=$MAJ.$MIN.$PAT" >> "$GITHUB_OUTPUT"
          echo "### $LAST → v$MAJ.$MIN.$PAT" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promover imagens (sha → versão)
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          for svc in backend frontend; do
            docker buildx imagetools create \
              -t npl2026/$svc:$VERSION \
              npl2026/$svc:$SHA_TAG
          done

      - name: Criar tag Git e GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes \
            --notes "Imagens: npl2026/backend:$VERSION, npl2026/frontend:$VERSION"
