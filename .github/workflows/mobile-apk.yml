name: Mobile APK (Android)

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente da API apontada pelo APK"
        type: choice
        options: [homolog, prod]
        default: homolog
      tipo:
        description: "Tipo de build Android"
        type: choice
        options: [debug, release]
        default: debug
      publicar_release:
        description: "Publicar GitHub Release pública (mobile-v*)? (apenas prod + release)"
        type: boolean
        default: false
  pull_request:
    paths:
      - 'frontend/na-ponta-do-lapis/android/**'
      - 'frontend/na-ponta-do-lapis/capacitor.config.ts'
      - '.github/workflows/mobile-apk.yml'

permissions:
  contents: write

concurrency:
  group: mobile-apk-${{ github.ref }}-${{ inputs.ambiente || 'pr' }}-${{ inputs.tipo || 'debug' }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK (${{ inputs.ambiente || 'homolog' }} / ${{ inputs.tipo || 'debug' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/na-ponta-do-lapis/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Ler versão do package.json
        id: pkg
        run: |
          PKG_VERSION=$(node -p "require('./frontend/na-ponta-do-lapis/package.json').version")
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Ajustar API e Service Token de homologação (quando aplicável)
        if: ${{ (inputs.ambiente || 'homolog') == 'homolog' }}
        env:
          CF_ID: ${{ secrets.HOMOLOG_CF_CLIENT_ID }}
          CF_SECRET: ${{ secrets.HOMOLOG_CF_CLIENT_SECRET }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "frontend/na-ponta-do-lapis/src/environments/environment.mobile.ts";
            const env = {
              production: true,
              apiBaseUrl: "https://homolog.napontadolapis.app/api/v1",
              cfAccessClientId: process.env.CF_ID || "",
              cfAccessClientSecret: process.env.CF_SECRET || "",
            };
            fs.writeFileSync(file, "export const environment = " + JSON.stringify(env, null, 4) + ";\n");
          '

      - name: Build Angular mobile e sync Capacitor
        run: |
          cd frontend/na-ponta-do-lapis
          npm ci
          npm run cap:sync

      - name: Compilar APK Debug
        if: ${{ (inputs.tipo || 'debug') == 'debug' }}
        env:
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          cd frontend/na-ponta-do-lapis/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -Phomolog="${{ (inputs.ambiente || 'homolog') == 'homolog' }}" \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="${PKG_VERSION}-debug.${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "${{ github.workspace }}/na-ponta-do-lapis-${{ inputs.ambiente || 'homolog' }}-debug.apk"

      - name: Compilar APK Release Assinado
        if: ${{ inputs.tipo == 'release' }}
        env:
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd frontend/na-ponta-do-lapis/android
          chmod +x gradlew
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Secrets de assinatura Android são obrigatórios para build release."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          VERSION_NAME="$PKG_VERSION"
          if [ "${{ inputs.ambiente || 'homolog' }}" = "homolog" ]; then
            VERSION_NAME="${PKG_VERSION}-homolog.${{ github.run_number }}"
          fi
          ./gradlew assembleRelease --no-daemon \
            -Phomolog="${{ (inputs.ambiente || 'homolog') == 'homolog' }}" \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="$VERSION_NAME" \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk \
            "${{ github.workspace }}/na-ponta-do-lapis-${{ inputs.ambiente || 'homolog' }}-release.apk"
          rm -f app/release.keystore

      - name: Publicar APK como Artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: na-ponta-do-lapis-apk-${{ inputs.ambiente || 'homolog' }}-${{ inputs.tipo || 'debug' }}
          path: ${{ github.workspace }}/*.apk
          retention-days: 14

      - name: Publicar GitHub Release Mobile (mobile-v* e mobile-latest)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publicar_release && inputs.ambiente == 'prod' && inputs.tipo == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          SRC_APK="${{ github.workspace }}/na-ponta-do-lapis-prod-release.apk"
          VERSIONED_APK="${{ github.workspace }}/na-ponta-do-lapis-mobile-v${PKG_VERSION}.apk"
          LATEST_APK="${{ github.workspace }}/na-ponta-do-lapis.apk"
          cp "$SRC_APK" "$VERSIONED_APK"
          cp "$SRC_APK" "$LATEST_APK"

          if gh release view "mobile-v${PKG_VERSION}" >/dev/null 2>&1; then
            gh release upload "mobile-v${PKG_VERSION}" "$VERSIONED_APK" --clobber
          else
            gh release create "mobile-v${PKG_VERSION}" "$VERSIONED_APK" --target "$GITHUB_SHA" \
              --title "App Android v${PKG_VERSION}" --generate-notes \
              --notes "APK Android assinado (versão ${PKG_VERSION}, build ${{ github.run_number }})"
          fi

          if gh release view "mobile-latest" >/dev/null 2>&1; then
            gh release upload "mobile-latest" "$LATEST_APK" --clobber
          else
            gh release create "mobile-latest" "$LATEST_APK" --target "$GITHUB_SHA" \
              --title "App Android (Última Versão)" \
              --notes "Último APK Android oficial publicado (v${PKG_VERSION})."
          fi

