name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-front.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-front.yml'

jobs:
  frontend:
    name: Build & Verify Frontend (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/na-ponta-do-lapis/package-lock.json

      - name: Instalar dependências (npm ci)
        working-directory: frontend/na-ponta-do-lapis
        run: npm ci

      - name: Build Angular
        working-directory: frontend/na-ponta-do-lapis
        run: npm run build

  dockerhub:
    name: Build e Push Docker Hub Frontend
    runs-on: ubuntu-latest
    needs: frontend
    # Publica a imagem no Docker Hub apenas quando o commit for integrado/mergeado na main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/na-ponta-do-lapis
          file: ./frontend/na-ponta-do-lapis/Dockerfile
          push: true
          tags: |
            npl2026/frontend:latest
            npl2026/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
