name: Frontend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-front.yml'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Validação do build Angular / Docker (sem push)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build da imagem (apenas validação)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/na-ponta-do-lapis
          file: ./frontend/na-ponta-do-lapis/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
