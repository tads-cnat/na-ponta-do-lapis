name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-front.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-front.yml'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    # O Angular é compilado dentro do Dockerfile (multi-stage), então este job
    # já valida o build da aplicação e da imagem.
    name: Build da imagem Docker (publica só na main)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login e push só acontecem em push na main. Em PR, a imagem é apenas construída (validação).
      - name: Login no DockerHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (e push na main)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/na-ponta-do-lapis
          file: ./frontend/na-ponta-do-lapis/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            npl2026/frontend:latest
            npl2026/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
