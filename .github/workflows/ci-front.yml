name: CI — Build Check

on:
  pull_request:
    branches:
      - main

jobs:

  frontend:
    name: Build Frontend (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/na-ponta-do-lapis/package-lock.json

      - name: Instalar dependências
        working-directory: frontend/na-ponta-do-lapis
        run: npm install

      - name: Build Angular
        working-directory: frontend/na-ponta-do-lapis
        run: npm run build
  
  dockerhub:
    name: Build e Push Docker Hub Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/na-ponta-do-lapis
          dockerfile: ./frontend/na-ponta-do-lapis/Dockerfile
          push: true
          tags: |
            npl2026/frontend:latest
            npl2026/frontend:${{ github.sha }}
