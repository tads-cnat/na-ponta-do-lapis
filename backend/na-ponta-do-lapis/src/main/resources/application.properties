spring.application.name=na-ponta-do-lapis
spring.profiles.default=postgres

# Define o contexto da aplicação para /api
server.servlet.context-path=/api

# Altera o endpoint do swagger
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
app.web-url=${APP_WEB_URL:https://napontadolapis.app}

# Configurações de Data e Fuso Horário
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jackson.deserialization.adjust-dates-to-context-time-zone=true

# Libera Requisição atraves do codespace (e essencial para o Nginx em produção)
server.forward-headers-strategy=framework

# Cloudinary config (Modificado para usar variáveis de ambiente como prioridade)
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:chave-nao-encontrada}
cloudinary.api_key=${CLOUDINARY_API_KEY:chave-nao-encontrada}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:chave-nao-encontrada}

# Gemini config (mantido apenas como fallback legado; a análise usa a chave do usuário)
gemini.api.key=${GEMINI_API_KEY:chave-nao-encontrada}

# ------------------------------------------------------------------------------
# Análise de faturas
# ------------------------------------------------------------------------------
# Limites de upload (o Nginx do frontend já aceita 20M)
spring.servlet.multipart.max-file-size=${FATURA_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${FATURA_MAX_REQUEST_SIZE:12MB}

# Cookie criptografado que guarda a chave de IA durante a sessão
fatura.cookie.nome=${FATURA_COOKIE_NAME:npl_fatura_ia}
fatura.cookie.secret=${FATURA_COOKIE_SECRET:${JWT_SECRET:na_ponta_do_lapis_dev_fatura_cookie_secret_2026}}
fatura.cookie.ttl-minutes=${FATURA_COOKIE_TTL_MINUTES:60}

# Regex
fatura.regex.timeout-ms=${FATURA_REGEX_TIMEOUT_MS:3000}
fatura.regex.max-text-chars=${FATURA_REGEX_MAX_TEXT_CHARS:300000}

# OCR local de PDFs escaneados
fatura.ocr.enabled=${FATURA_OCR_ENABLED:true}
fatura.ocr.min-chars=${FATURA_OCR_MIN_CHARS:40}
fatura.ocr.dpi=${FATURA_OCR_DPI:300}
fatura.ocr.timeout-seconds=${FATURA_OCR_TIMEOUT_SECONDS:30}
fatura.ocr.max-pages=${FATURA_OCR_MAX_PAGES:10}

# Provedores de IA e modelos padrão (podem ser trocados por variável de ambiente)
fatura.ia.gemini.model=${FATURA_IA_GEMINI_MODEL:gemini-2.5-flash}
fatura.ia.claude.model=${FATURA_IA_CLAUDE_MODEL:claude-sonnet-4-5}
fatura.ia.openai.model=${FATURA_IA_OPENAI_MODEL:gpt-4.1-mini}
fatura.ia.deepseek.model=${FATURA_IA_DEEPSEEK_MODEL:deepseek-chat}
fatura.ia.groq.model=${FATURA_IA_GROQ_MODEL:llama-3.3-70b-versatile}
fatura.ia.connect-timeout-seconds=${FATURA_IA_CONNECT_TIMEOUT:10}
fatura.ia.read-timeout-seconds=${FATURA_IA_READ_TIMEOUT:90}
fatura.ia.max-text-chars=${FATURA_IA_MAX_TEXT_CHARS:60000}

# CORS config (padrão local para desenvolvimento)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# JWT config
jwt.secret=${JWT_SECRET:na_ponta_do_lapis_dev_jwt_secret_key_super_segura_com_mais_de_256_bits_2026}
jwt.expire-days=${JWT_EXPIRE_DAYS:1}
jwt.expire-hours=${JWT_EXPIRE_HOURS:1}
jwt.expire-minutes=${JWT_EXPIRE_MINUTES:5}
jwt.expiration-refresh-days=${JWT_EXPIRE_REFRESH_DAYS:7}

# Actuator - Health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Desativa a pagina de erro padrao (Whitelabel) do Spring
server.error.whitelabel.enabled=false
# Seeder de dados de desenvolvimento (padrão true localmente).
# Ambientes deployados usam application-prod.properties (false) e o compose passa APP_SEED_ENABLED.
app.seed.enabled=${APP_SEED_ENABLED:true}
