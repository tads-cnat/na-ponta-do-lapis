# Banco de Dados (PostgreSQL do stack de deploy: homologação e produção)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP - Pool de Conexões (ajustado para o Postgres do stack de deploy)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000

# JPA / Hibernate 
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CORS (Origens permitidas com fallback seguro para produção)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://napontadolapis.app,https://www.napontadolapis.app}

# JWT (as durações vêm de application.properties: jwt.expire-*)
jwt.secret=${JWT_SECRET}

# Seeder desativado por padrão em ambientes deployados (habilite apenas em homologação)
app.seed.enabled=${APP_SEED_ENABLED:false}
